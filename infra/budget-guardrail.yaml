AWSTemplateFormatVersion: "2010-09-09"
Description: >
  ember-gs budget guardrail. Emails you at 50%, 80% and 100% of a monthly budget
  (actual spend) and when forecast spend crosses 100%. Deploy this FIRST, before
  anything that can cost money. Budgets alert you; they don't stop spending.

Parameters:
  MonthlyLimitUSD:
    Type: Number
    Default: 25
  AlertEmail:
    Type: String
    Description: Where budget alerts are sent.

Resources:
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: ember-gs-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyLimitUSD
          Unit: USD
        CostTypes:
          IncludeCredit: false # show real usage even while credits cover it
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 50, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]
        - Notification: { NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]
