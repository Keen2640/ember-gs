<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ember-gs</title>
<style>
  :root { --bg:#fbfbf9; --fg:#1d1d1b; --muted:#5f5f5a; --accent:#c2410c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141413; --fg:#ecebe6; --muted:#a3a29b; --accent:#fb923c; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui, sans-serif; }
  main { max-width:680px; margin:0 auto; padding:48px 16px; }
  h1 { font-size:28px; margin:0 0 8px; } p { color:var(--muted); } a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>ember-gs</h1>
  <p>Grid-aware EV charging for the Texas grid, plus a cloud satellite ground station on AWS.
     This site hosts the app's public key for the Tesla Fleet API and its OAuth callback page.</p>
  <p>Code: <a href="https://github.com/Keen2640/ember-gs">github.com/Keen2640/ember-gs</a></p>
</main>
</body>
</html>
