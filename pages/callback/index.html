<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>ember login</title>
<style>
  :root { --bg:#fbfbf9; --fg:#1d1d1b; --muted:#5f5f5a; --box:#efeee9; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141413; --fg:#ecebe6; --muted:#a3a29b; --box:#24241f; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui, sans-serif; }
  main { max-width:680px; margin:0 auto; padding:48px 16px; }
  code { display:block; background:var(--box); padding:12px; border-radius:8px; word-break:break-all; }
  button { margin-top:12px; padding:8px 16px; font:inherit; cursor:pointer; }
  p { color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>ember: Tesla login</h1>
  <p id="msg">Reading the authorization code…</p>
  <code id="code" hidden></code>
  <button id="copy" hidden>Copy code</button>
  <p>Paste it into <b>ember tesla login --paste</b> in your terminal. The code works once and expires in minutes.
     Nothing on this page is sent anywhere.</p>
</main>
<script>
  const q = new URLSearchParams(location.search);
  const code = q.get("code"), err = q.get("error");
  const msg = document.getElementById("msg"), box = document.getElementById("code"), btn = document.getElementById("copy");
  if (code) {
    msg.textContent = "Login approved. Your one-time code:";
    box.textContent = code; box.hidden = false; btn.hidden = false;
    btn.onclick = () => navigator.clipboard.writeText(code).then(() => btn.textContent = "Copied");
    history.replaceState(null, "", location.pathname);  // drop the code from the address bar
  } else {
    msg.textContent = err ? "Tesla returned an error: " + err : "No code in this URL.";
  }
</script>
</body>
</html>
