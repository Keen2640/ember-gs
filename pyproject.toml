[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ember-gs"
version = "0.1.0"
description = "Cloud satellite ground station on AWS for real-time wildfire detection from NASA/NOAA direct broadcast"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "skyfield>=1.48",
    "h5py>=3.10",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
ml = ["scikit-learn>=1.4"]
dev = ["pytest>=8", "cfn-lint>=1.0", "ruff>=0.5", "scikit-learn>=1.4"]

[project.scripts]
ember = "ember.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning:skyfield.*"]

[tool.ruff]
line-length = 120
target-version = "py310"
