services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ember
      POSTGRES_PASSWORD: ember-local-only
      POSTGRES_DB: ember
    ports:
      - "5432:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
